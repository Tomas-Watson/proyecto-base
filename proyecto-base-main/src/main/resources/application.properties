spring.application.name=demo

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/demo?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# El esquema lo crea schema.sql en cada arranque (según el DER): Hibernate no debe crear ni modificar tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool (HikariCP)
#spring.datasource.hikari.maximum-pool-size=
#spring.datasource.hikari.minimum-idle=
#spring.datasource.hikari.connection-timeout=

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

app.seguridad.jwt.secreto=${JWT_SECRETO:clave-de-desarrollo-ecogestion-verde-grupo-6-aydsii}
app.seguridad.jwt.minutos=120

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/json
