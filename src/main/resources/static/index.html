<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Estado del Pedido - CU-09</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button.btn-primary {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
            width: 100%;
        }
        button.btn-primary:hover {
            background-color: #0056b3;
        }
        .order-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-detail {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-detail:hover {
            background-color: #218838;
        }
        .detail-box {
            margin-top: 25px;
            background: #e8f4fd;
            border: 1px solid #b8daff;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .info-alt {
            background: #fff3cd;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid #ffc107;
            margin-top: 10px;
            font-size: 14px;
            color: #856404;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sistema de Compras - UNLPam (aydsii)</h2>
        <h3>CU-09: Consultar Estado del Pedido</h3>
        
        <div class="form-group">
            <label for="idUsuario">ID de Usuario Logueado:</label>
            <input type="number" id="idUsuario" value="1">
        </div>
        
        <button class="btn-primary" onclick="cargarPedidos()">Consultar Mis Pedidos</button>

        <div id="listaPedidos" style="margin-top: 20px;"></div>

        <div id="detallePedido" class="detail-box">
            <h3>Detalle y Estado del Pedido Seleccionado</h3>
            <div id="contenidoDetalle"></div>
        </div>
    </div>

<script>
    const baseUrl = 'http://localhost:8080/api/cu09/usuarios';

    async function cargarPedidos() {
        const idUsuario = document.getElementById('idUsuario').value;
        const contenedor = document.getElementById('listaPedidos');
        document.getElementById('detallePedido').style.display = 'none';
        contenedor.innerHTML = 'Cargando pedidos...';

        try {
            const response = await fetch(`${baseUrl}/${idUsuario}/pedidos`);
            if (!response.ok) throw new Error('No se pudieron obtener los pedidos.');
            
            const apiResponse = await response.json(); // Obtenemos el ApiResponse
            const pedidos = apiResponse.data;          // Extraemos los datos reales
            
            if (!pedidos || pedidos.length === 0) {
                contenedor.innerHTML = '<p>No tienes pedidos registrados.</p>';
                return;
            }

            let html = `<h4>${apiResponse.message}</h4>`; // Opcional: muestra el mensaje del backend
            pedidos.forEach(p => {
                html += `
                    <div class="order-card">
                        <div>
                            <strong>Pedido #${p.idPedido}</strong><br>
                            <small>Fecha: ${p.fechaHora.replace('T', ' ')}</small><br>
                            <strong>Estado:</strong> ${p.estado} | <strong>Total:</strong> $${p.montoTotal}
                        </div>
                        <button class="btn-detail" onclick="verEstadoEspecifico(${idUsuario}, ${p.idPedido})">Ver Estado</button>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        } catch (error) {
            contenedor.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
    }

    async function verEstadoEspecifico(idUsuario, idPedido) {
        const cajaDetalle = document.getElementById('detallePedido');
        const contenido = document.getElementById('contenidoDetalle');
        cajaDetalle.style.display = 'block';
        contenido.innerHTML = 'Consultando estado detallado...';

        try {
            const response = await fetch(`${baseUrl}/${idUsuario}/pedidos/${idPedido}/estado`);
            if (!response.ok) throw new Error('No se pudo consultar el estado.');
            
            const apiResponse = await response.json(); // Obtenemos el ApiResponse
            const detalle = apiResponse.data;          // Extraemos el DTO de estado
            
            contenido.innerHTML = `
                <p><strong>ID de Pedido:</strong> ${detalle.idPedido}</p>
                <p><strong>Fecha y Hora:</strong> ${detalle.fechaHora.replace('T', ' ')}</p>
                <p><strong>Estado Actual:</strong> <span style="color: #0056b3; font-weight: bold;">${detalle.estado}</span></p>
                <p><strong>Monto Total:</strong> $${detalle.montoTotal}</p>
                <div class="info-alt">
                    <strong>Información y Flujos Alternativos:</strong><br>
                    ${detalle.informacionComplementaria}
                </div>
            `;
        } catch (error) {
            contenido.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
    }
</script>
</body>
</html>
